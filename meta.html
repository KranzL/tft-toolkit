<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meta Watch, TFT Toolkit</title>
<meta name="description" content="What Master+ players are climbing with in Teamfight Tactics Set 18 across NA, EU, KR, China and every other region.">
<meta property="og:title" content="TFT Meta Watch">
<meta property="og:description" content="Master+ comps, trends, region splits and China data for TFT Set 18.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://lkranz.com/tft/meta.html">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #F2F4F0; --surface: #FFFFFF; --surface-2: #E8ECE5; --ink: #1A1F1B; --muted: #5F6A61; --line: #D3DAD1;
  --accent: #2E7D4F; --accent-ink: #FFFFFF; --wisp: #3C6FA8; --good: #2E7D4F; --warn: #B7791F; --bad: #B8433B;
  --gold: #B8860B; --chip: #EEF2EC; --shadow: 0 1px 2px rgba(20, 30, 22, 0.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111512; --surface: #181D19; --surface-2: #212824; --ink: #E6EBE5; --muted: #97A399; --line: #2B342D;
    --accent: #62C486; --accent-ink: #0F1511; --wisp: #86B6EC; --good: #62C486; --warn: #E0A33C; --bad: #E06A61;
    --gold: #E2B441; --chip: #222A25; --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  }
}
:root[data-theme="dark"] {
  --bg: #111512; --surface: #181D19; --surface-2: #212824; --ink: #E6EBE5; --muted: #97A399; --line: #2B342D;
  --accent: #62C486; --accent-ink: #0F1511; --wisp: #86B6EC; --good: #62C486; --warn: #E0A33C; --bad: #E06A61;
  --gold: #E2B441; --chip: #222A25; --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; font-size: 14px; line-height: 1.45; }
a { color: var(--wisp); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 24px 20px 60px; }
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
h1 { font-family: "Bricolage Grotesque", "IBM Plex Sans", sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -0.02em; margin: 0; line-height: 1.05; text-wrap: balance; }
.sub { color: var(--muted); margin-top: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; background: var(--chip); border: 1px solid var(--line); font-size: 12px; white-space: nowrap; }
.chip.cost1 { border-color: #8a8f8a; } .chip.cost2 { border-color: #3f9b5c; } .chip.cost3 { border-color: #3C6FA8; } .chip.cost4 { border-color: #9b59b6; } .chip.cost5 { border-color: var(--gold); border-width: 2px; }
.chip.emblem { background: transparent; border-style: dashed; border-color: var(--gold); color: var(--ink); }
.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 5; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.seg button, .tabs button, select, .btn { font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.seg button[aria-pressed="true"], .tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.seg button:focus-visible, .tabs button:focus-visible, select:focus-visible, .btn:focus-visible, .row-toggle:focus-visible { outline: 2px solid var(--wisp); outline-offset: 2px; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; }
label.inline { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 18px 0; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; box-shadow: var(--shadow); }
.tile .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
.tile .v { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 24px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.tile .d { color: var(--muted); font-size: 12px; margin-top: 2px; }
section { margin-top: 26px; }
h2 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 20px; margin: 0 0 4px; letter-spacing: -0.01em; }
h3 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 15px; margin: 18px 0 6px; }
.lead { color: var(--muted); margin: 0 0 12px; max-width: 70ch; }
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; background: var(--surface-2); position: sticky; top: 0; }
th.num, td.num { text-align: right; }
tr.comp:hover { background: var(--surface-2); }
tr.detail td { background: var(--surface-2); padding: 12px 14px 16px; }
.row-toggle { font: inherit; background: none; border: 0; color: var(--ink); cursor: pointer; padding: 0; text-align: left; font-weight: 600; }
.row-toggle::before { content: "+"; display: inline-block; width: 14px; color: var(--muted); }
tr.open .row-toggle::before { content: "\2013"; }
.place { display: inline-block; min-width: 46px; padding: 2px 6px; border-radius: 4px; text-align: center; font-weight: 600; }
.place.good { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.place.mid { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.place.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.delta.up { color: var(--good); } .delta.down { color: var(--bad); } .delta.flat { color: var(--muted); }
svg.spark { width: 96px; height: 26px; display: block; }
.detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px 22px; }
.detail-grid h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.bars { display: grid; grid-template-columns: 52px 1fr 54px; gap: 4px 8px; align-items: center; font-size: 12px; }
.bar { height: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
ul.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13px; }
.muted { color: var(--muted); }
.mono { font-family: "IBM Plex Mono", monospace; font-size: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; box-shadow: var(--shadow); }
.card h3 { margin-top: 0; }
.note { background: var(--surface); border-left: 3px solid var(--wisp); padding: 10px 14px; border-radius: 0 6px 6px 0; color: var(--ink); }
[hidden] { display: none !important; }
@media (max-width: 720px) { h1 { font-size: 26px; } .wrap { padding: 16px 12px 40px; } th, td { padding: 6px 7px; } }
@media (prefers-reduced-motion: no-preference) { tr.comp { transition: background 120ms; } }
.form { display: grid; gap: 8px; }
.form label { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; }
.form input[type=password], .form input[type=number] { font: inherit; font-size: 13px; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.form input[type=password] { min-width: 260px; }
.form .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.sub-h { margin: 10px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.status { color: var(--muted); font-size: 13px; min-height: 18px; padding: 8px 0 0; }
.topnav { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.topnav a { margin-right: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topnav"><a href="./">TFT Toolkit</a><a href="planner.html">Emblem Planner</a><span>Meta Watch</span></div>
  <header class="top">
    <div>
      <h1>Enchanted Wilds Meta Watch</h1>
      <div class="sub" id="subtitle">Loading...</div>
    </div>
    <div class="chips" id="sourceChips"></div>
  </header>
  <div class="controls">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="seg" id="regionSeg" aria-label="Region"></div>
    <label class="inline">rank floor <select id="rankSel">
      <option value="master">Master+</option>
      <option value="diamond">Diamond+</option>
      <option value="emerald">Emerald+</option>
      <option value="platinum">Platinum+</option>
    </select></label>
    <label class="inline"><input type="checkbox" id="showSmall"> include small samples</label>
    <label class="inline">sort <select id="sortSel">
      <option value="share">play share</option>
      <option value="place">average placement</option>
      <option value="top4">top 4 rate</option>
      <option value="win">win rate</option>
      <option value="trend">rising</option>
    </select></label>
    <button class="btn" id="refresh">Refresh</button>
  </div>
  <div class="status" id="status"></div>
  <div id="tiles" class="tiles"></div>
  <main id="main"></main>
</div>
<script src="js/names.js"></script>
<script src="js/tactics.js"></script>
<script src="js/tencent.js"></script>
<script src="js/riot.js"></script>
<script src="js/insights.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
