<style>
:root {
  --bg: #F2F4F0; --surface: #FFFFFF; --surface-2: #E8ECE5; --ink: #1A1F1B; --muted: #5F6A61; --line: #D3DAD1;
  --accent: #A67C0A; --accent-ink: #FFFFFF; --wisp: #3C6FA8; --chip: #EEF2EC; --shadow: 0 1px 2px rgba(20, 30, 22, 0.08);
  --bronze: #9A5B2C; --silver: #6E7B88; --gold: #B8860B; --prismatic: #6F5BD1; --unique: #B85C2E; --off: #9AA39C;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111512; --surface: #181D19; --surface-2: #212824; --ink: #E6EBE5; --muted: #97A399; --line: #2B342D;
    --accent: #E2B441; --accent-ink: #14170F; --wisp: #86B6EC; --chip: #222A25; --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    --bronze: #D08A55; --silver: #A9B6C3; --gold: #E6C15A; --prismatic: #B3A6F5; --unique: #E08A5A; --off: #6E7870;
  }
}
:root[data-theme="dark"] {
  --bg: #111512; --surface: #181D19; --surface-2: #212824; --ink: #E6EBE5; --muted: #97A399; --line: #2B342D;
  --accent: #E2B441; --accent-ink: #14170F; --wisp: #86B6EC; --chip: #222A25; --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  --bronze: #D08A55; --silver: #A9B6C3; --gold: #E6C15A; --prismatic: #B3A6F5; --unique: #E08A5A; --off: #6E7870;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; font-size: 14px; line-height: 1.45; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 24px 20px 60px; }
header { padding-bottom: 16px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-end; }
h1 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -0.02em; margin: 0; line-height: 1.05; text-wrap: balance; }
.sub { color: var(--muted); margin-top: 6px; max-width: 70ch; }
.layout { display: grid; grid-template-columns: 360px 1fr; gap: 22px; margin-top: 20px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow); position: sticky; top: 12px; }
@media (max-width: 900px) { .panel { position: static; } }
h2 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 16px; margin: 0 0 8px; }
h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 16px 0 6px; font-weight: 600; }
.emblems { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.emb { display: flex; align-items: center; justify-content: space-between; gap: 6px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--chip); }
.emb.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.emb .n { font-weight: 600; font-size: 13px; }
.emb .r { color: var(--muted); font-size: 11px; }
.ctr { display: inline-flex; align-items: center; gap: 2px; }
.ctr button { width: 22px; height: 22px; border-radius: 5px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; line-height: 1; }
.ctr span { min-width: 16px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.seg button, .btn, select, input[type=text] { font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
input[type=text] { cursor: text; width: 100%; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; padding: 9px 14px; width: 100%; margin-top: 16px; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--wisp); outline-offset: 2px; }
label.inline { display: flex; align-items: center; gap: 8px; margin: 4px 0; color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 999px; background: var(--chip); border: 1px solid var(--line); font-size: 12px; white-space: nowrap; }
.chip.cost1 { border-color: #8a8f8a; } .chip.cost2 { border-color: #3f9b5c; } .chip.cost3 { border-color: #3C6FA8; } .chip.cost4 { border-color: #9b59b6; } .chip.cost5 { border-color: var(--gold); border-width: 2px; }
.chip.temp { border-style: dashed; color: var(--muted); }
.chip .hold { color: var(--accent); font-weight: 600; }
.chip.x { cursor: pointer; }
.trait { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 6px; font-size: 12px; border: 1px solid var(--line); background: var(--surface); }
.trait i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; transform: rotate(45deg); }
.trait.bronze i { background: var(--bronze); } .trait.silver i { background: var(--silver); } .trait.gold i { background: var(--gold); } .trait.prismatic i { background: var(--prismatic); } .trait.unique i { background: var(--unique); } .trait.off i { background: var(--off); }
.trait.off { color: var(--muted); border-style: dashed; }
.trait b { font-variant-numeric: tabular-nums; }
.results { display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow); }
.card header { border: 0; padding: 0 0 8px; }
.score { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 18px; }
.meta { color: var(--muted); font-size: 12px; }
.path { display: grid; grid-template-columns: 58px 1fr 70px; gap: 4px 10px; align-items: center; font-size: 13px; margin-top: 6px; }
.path .lvl { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--muted); }
.path .cnt { color: var(--muted); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
.note { background: var(--surface); border-left: 3px solid var(--wisp); padding: 10px 14px; border-radius: 0 6px 6px 0; }
.status { color: var(--muted); font-size: 12px; margin-top: 8px; min-height: 16px; }
details summary { cursor: pointer; color: var(--muted); font-size: 12px; margin-top: 8px; }
[hidden] { display: none !important; }
</style>
<div class="wrap">
  <header>
    <div>
      <h1>Wilds Emblem Planner</h1>
      <div class="sub">Pick the emblems you are holding. The planner searches every Set 18 board for the ones that turn those emblems into the most trait breakpoints, then shows how to get there level by level.</div>
    </div>
    <div class="meta" id="setinfo"></div>
  </header>
  <div class="layout">
    <aside class="panel">
      <h2>Your emblems</h2>
      <div class="emblems" id="emblems"></div>
      <h3>Board size (level)</h3>
      <div class="seg" id="levelSeg"></div>
      <h3>Goal</h3>
      <div class="seg" id="objSeg"></div>
      <h3>Roster</h3>
      <label class="inline"><input type="checkbox" id="allow5" checked> allow 5-cost units</label>
      <label class="inline"><input type="checkbox" id="khazix"> Kha'Zix has evolved (can carry a second trait)</label>
      <h3>Must include</h3>
      <input type="text" id="incInput" list="unitList" placeholder="type a unit and press Enter">
      <div class="chips" id="incChips" style="margin-top:6px"></div>
      <h3>Leave out</h3>
      <input type="text" id="excInput" list="unitList" placeholder="type a unit and press Enter">
      <div class="chips" id="excChips" style="margin-top:6px"></div>
      <datalist id="unitList"></datalist>
      <button class="btn primary" id="run">Find boards</button>
      <div class="status" id="status"></div>
    </aside>
    <main>
      <div id="results" class="results"></div>
    </main>
  </div>
</div>

  $('#levelSeg').replaceChildren(...[6, 7, 8, 9, 10].map(l => h('button', { 'aria-pressed': String(state.level === l), onclick: () => { state.level = l; renderSegs(); } }, String(l))));
  $('#objSeg').replaceChildren(...[['tiers', 'Strongest breakpoints'], ['traits', 'Most active traits']].map(([id, label]) => h('button', { 'aria-pressed': String(state.objective === id), onclick: () => { state.objective = id; renderSegs(); } }, label)));
}
function renderLists() {
  const mk = (list, id) => $(id).replaceChildren(...list.map(n => h('span', { class: 'chip x', role: 'button', tabindex: '0', title: 'remove', onclick: () => { list.splice(list.indexOf(n), 1); renderLists(); } }, n, ' ×')));
  mk(state.include, '#incChips'); mk(state.exclude, '#excChips');
}
function bindInput(id, list) {
  const el = $(id);
  el.addEventListener('keydown', e => { if (e.key !== 'Enter') return; const v = el.value.trim(); const unit = UNITS.find(u => u.name.toLowerCase() === v.toLowerCase()); if (unit && !list.includes(unit.name)) { list.push(unit.name); renderLists(); } el.value = ''; });
  el.addEventListener('change', () => { const v = el.value.trim(); const unit = UNITS.find(u => u.name.toLowerCase() === v.toLowerCase()); if (unit && !list.includes(unit.name)) { list.push(unit.name); renderLists(); el.value = ''; } });
}
const costChip = (label, cost, extra, temp) => h('span', { class: 'chip cost' + cost + (temp ? ' temp' : '') }, label, extra ? h('span', { class: 'hold' }, extra) : null, temp ? h('span', null, 'temp') : null);
function traitTag(l) {
  const cls = l.style || 'off';
  const nxt = l.nextMin ? ' → ' + l.nextMin : '';
  return h('span', { class: 'trait ' + cls, title: l.style ? l.style + ' at ' + l.count + (l.nextMin ? ', next breakpoint at ' + l.nextMin : '') : 'inactive, needs ' + l.nextMin }, h('i'), l.name, ' ', h('b', null, l.count + nxt), l.fromEmblems ? h('span', { class: 'hold' }, '+' + l.fromEmblems + ' emblem') : null);
}
function renderResults(results, emblems, ms) {
  const box = $('#results'); box.replaceChildren();
  const embLabel = Object.entries(emblems).filter(([, v]) => v).map(([k, v]) => v > 1 ? k + ' x' + v : k).join(', ') || 'no emblems';
  box.append(h('div', { class: 'note' }, h('strong', null, embLabel), ' at level ' + state.level + ', ' + (state.objective === 'tiers' ? 'strongest breakpoints' : 'most active traits') + '. ' + results.length + ' boards in ' + ms + ' ms. Gold labels on a unit show which emblem it should hold; a unit cannot hold an emblem for a trait it already has.'));
  results.forEach((r, i) => {
    const card = h('div', { class: 'card' },
      h('header', null, h('div', null, h('span', { class: 'score' }, '#' + (i + 1) + '  ' + r.active + ' traits active, ' + r.points + ' tier points'), h('div', { class: 'meta' }, r.cost + ' gold of units' + (r.luxOrigin ? ', Lux as ' + r.luxOrigin : '') + (r.evo ? ', Kha\'Zix evolved into ' + r.evo : '') + (r.feasible ? '' : ', not every emblem has a legal holder')))),
      h('div', { class: 'chips' }, r.units.map(c => costChip(c.label, c.cost, (r.holders[c.key] || []).map(t => ' +' + t).join('')))),
      h('h3', null, 'Traits'), h('div', { class: 'chips' }, r.lines.filter(l => l.style).map(traitTag)),
      r.lines.some(l => !l.style) ? h('div', { class: 'chips', style: 'margin-top:5px' }, r.lines.filter(l => !l.style).map(traitTag)) : null,
      h('details', null, h('summary', null, 'Show the level-by-level path'), h('div', { class: 'path' }, r.path.flatMap(s => [h('span', { class: 'lvl' }, 'lvl ' + s.size), h('div', { class: 'chips' }, s.units.map(u => costChip(u.label, u.cost, null, u.temp))), h('span', { class: 'cnt' }, s.active + ' traits')]))));
    box.append(card);
  });
}
function run() {
  $('#status').textContent = 'Searching boards...';
  setTimeout(() => {
    const t0 = performance.now();
    const emblems = Object.assign({}, state.emblems);
    const opts = { level: state.level, objective: state.objective, maxCost: $('#allow5').checked ? 5 : 4, include: state.include.slice(), exclude: state.exclude.slice(), khazix: $('#khazix').checked, restarts: 40, topN: 8, seed: 11 };
    let results;
    try { results = solve(emblems, opts); } catch (e) { $('#status').textContent = 'Could not search: ' + e.message; return; }
    const ms = Math.round(performance.now() - t0);
    renderResults(results, emblems, ms);
    $('#status').textContent = 'Done in ' + ms + ' ms.';
  }, 20);
}
(function init() {
  $('#setinfo').textContent = 'Set ' + DATA.set + ' ' + DATA.set_name + ', ' + UNITS.length + ' units, ' + EMBLEM_TRAITS.length + ' emblems. Data from Riot game files, built ' + (DATA.built_at || '').slice(0, 10) + '.';
  $('#unitList').replaceChildren(...UNITS.map(u => h('option', { value: u.name })));
  state.emblems = { Blossom: 1, Fae: 1 };
  renderEmblems(); renderSegs(); renderLists(); bindInput('#incInput', state.include); bindInput('#excInput', state.exclude);
  $('#run').addEventListener('click', run);
  run();
})();
</script>
